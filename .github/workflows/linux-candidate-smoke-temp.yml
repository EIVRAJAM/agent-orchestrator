name: Linux candidate smoke (temporary)

# Temporary validation only. The branch-scoped push trigger is required because
# workflow_dispatch only runs workflows that already exist on the default branch.
on:
  push:
    branches:
      - test/linux-candidate-smoke-1faea84

permissions:
  contents: read
  actions: read

env:
  CANDIDATE_RUN: "41171078391"
  CANDIDATE_VERSION: "0.13.0-privacy.3"
  SOURCE_SHA: "1faea84df45ff798cce7f3f81a7e212dea066ce6"
  BUILD_RUN: "41170116263"
  CANDIDATE_ARTIFACT: "fork-linux-0.13.0-privacy.3"

jobs:
  debian13-appimage:
    name: Debian 13 — AppImage
    runs-on: ubuntu-22.04
    container: debian:13
    timeout-minutes: 45
    steps:
      - name: Install checkout prerequisites in the disposable Debian container
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git tar gzip unzip findutils python3 curl ca-certificates

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download canonical candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: candidate
          run-id: ${{ env.CANDIDATE_RUN }}
          repository: EIVRAJAM/agent-orchestrator
          github-token: ${{ github.token }}

      - name: Validate candidate metadata and checksums
        run: |
          set -euo pipefail
          cd candidate
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import base64, hashlib, json, os, re
          meta = json.load(open("release-metadata.json"))
          expected = {
              "version": "0.13.0-privacy.3",
              "source_sha": "1faea84df45ff798cce7f3f81a7e212dea066ce6",
              "build_run_id": 41170116263,
              "source_repository": "EIVRAJAM/agent-orchestrator",
          }
          for key, value in expected.items():
              got = meta.get(key)
              print(f"{key}={got}")
              if got != value:
                  raise SystemExit(f"{key}: got {got!r}, want {value!r}")
          text = open("latest-linux.yml", encoding="utf-8").read()
          path = re.search(r"(?m)^\s*path:\s*(\S+)\s*$", text).group(1)
          url = re.search(r"(?m)^\s*-\s*url:\s*(\S+)\s*$", text).group(1)
          sha = re.search(r"(?m)^\s*sha512:\s*(\S+)\s*$", text).group(1)
          size = int(re.search(r"(?m)^\s*size:\s*(\d+)\s*$", text).group(1))
          app = "Agent.Orchestrator-0.13.0-privacy.3.AppImage"
          assert path == url == app, (path, url, app)
          assert size == os.path.getsize(app), (size, os.path.getsize(app))
          assert sha == base64.b64encode(hashlib.sha512(open(app, "rb").read()).digest()).decode()
          print("LATEST_OK", path, size)
          PY

      - name: Install Debian runtime dependencies
        run: |
          set -euo pipefail
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb xauth libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libatspi2.0-0t64 \
            libxcb-dri3-0 libxss1 libxtst6 libsecret-1-0 libnotify4 xdg-utils

      - name: Start Xvfb
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x1024x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for _ in $(seq 1 20); do
            [ -S /tmp/.X11-unix/X99 ] && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/xvfb.log"
          exit 1

      - name: Smoke AppImage
        run: |
          set -euo pipefail
          chmod 700 candidate/Agent.Orchestrator-0.13.0-privacy.3.AppImage
          mkdir -p "$RUNNER_TEMP/appimage"
          (cd "$RUNNER_TEMP/appimage" && "$GITHUB_WORKSPACE/candidate/Agent.Orchestrator-0.13.0-privacy.3.AppImage" --appimage-extract)
          APP="$RUNNER_TEMP/appimage/squashfs-root/agent-orchestrator"
          CLI="$RUNNER_TEMP/appimage/squashfs-root/resources/daemon/ao"
          test -x "$APP"
          test -x "$CLI"
          bash test/linux-candidate-smoke.sh appimage "$APP" "$CLI" "$CANDIDATE_VERSION"

  debian13-deb:
    name: Debian 13 — deb
    runs-on: ubuntu-22.04
    container: debian:13
    timeout-minutes: 45
    steps:
      - name: Install checkout prerequisites in the disposable Debian container
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git tar gzip unzip findutils python3 curl ca-certificates

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download canonical candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: candidate
          run-id: ${{ env.CANDIDATE_RUN }}
          repository: EIVRAJAM/agent-orchestrator
          github-token: ${{ github.token }}

      - name: Validate candidate metadata and checksums
        run: |
          set -euo pipefail
          cd candidate
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import json
          meta = json.load(open("release-metadata.json"))
          expected = {
              "version": "0.13.0-privacy.3",
              "source_sha": "1faea84df45ff798cce7f3f81a7e212dea066ce6",
              "build_run_id": 41170116263,
              "source_repository": "EIVRAJAM/agent-orchestrator",
          }
          for key, value in expected.items():
              got = meta.get(key)
              print(f"{key}={got}")
              if got != value:
                  raise SystemExit(f"{key}: got {got!r}, want {value!r}")
          print("METADATA_OK")
          PY

      - name: Install Debian runtime dependencies
        run: |
          set -euo pipefail
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xvfb xauth libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libatspi2.0-0t64 \
            libxcb-dri3-0 libxss1 libxtst6 libsecret-1-0 libnotify4 xdg-utils

      - name: Install deb and verify installed files
        run: |
          set -euo pipefail
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./candidate/agent-orchestrator_0.13.0-privacy.3_amd64.deb
          test "$(dpkg-query -W -f='${Version}' agent-orchestrator)" = "0.13.0-privacy.3"
          dpkg -L agent-orchestrator | grep -qx '/usr/bin/agent-orchestrator'
          APP="$(command -v agent-orchestrator)"
          CLI="$(find /usr/lib/agent-orchestrator -path '*/resources/daemon/ao' -type f -print -quit)"
          test -x "$APP"
          test -x "$CLI"
          echo "DEB_INSTALL_OK version=$(dpkg-query -W -f='${Version}' agent-orchestrator) app=$APP cli=$CLI"

      - name: Start Xvfb
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x1024x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for _ in $(seq 1 20); do
            [ -S /tmp/.X11-unix/X99 ] && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/xvfb.log"
          exit 1

      - name: Smoke installed deb
        run: |
          set -euo pipefail
          APP="$(command -v agent-orchestrator)"
          CLI="$(find /usr/lib/agent-orchestrator -path '*/resources/daemon/ao' -type f -print -quit)"
          test -x "$APP"
          test -x "$CLI"
          bash test/linux-candidate-smoke.sh deb "$APP" "$CLI" "$CANDIDATE_VERSION"

  rocky9-rpm:
    name: Rocky Linux 9.6 — rpm
    runs-on: ubuntu-22.04
    container: rockylinux:9.6
    timeout-minutes: 45
    steps:
      - name: Install checkout prerequisites in the disposable Rocky container
        run: |
          set -euo pipefail
          dnf -y install git tar gzip unzip findutils python3 curl ca-certificates

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download canonical candidate
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.CANDIDATE_ARTIFACT }}
          path: candidate
          run-id: ${{ env.CANDIDATE_RUN }}
          repository: EIVRAJAM/agent-orchestrator
          github-token: ${{ github.token }}

      - name: Validate candidate metadata and checksums
        run: |
          set -euo pipefail
          cd candidate
          sha256sum --check SHA256SUMS
          python3 - <<'PY'
          import json
          meta = json.load(open("release-metadata.json"))
          expected = {
              "version": "0.13.0-privacy.3",
              "source_sha": "1faea84df45ff798cce7f3f81a7e212dea066ce6",
              "build_run_id": 41170116263,
              "source_repository": "EIVRAJAM/agent-orchestrator",
          }
          for key, value in expected.items():
              got = meta.get(key)
              print(f"{key}={got}")
              if got != value:
                  raise SystemExit(f"{key}: got {got!r}, want {value!r}")
          print("METADATA_OK")
          PY

      - name: Install rpm and verify package metadata
        run: |
          set -euo pipefail
          dnf -y install --nogpgcheck ./candidate/agent-orchestrator-0.13.0-privacy.3-1.x86_64.rpm
          dnf -y install xorg-x11-server-Xvfb xorg-x11-xauth python3 curl findutils util-linux
          rpm -q agent-orchestrator
          installed="$(rpm -q --qf '%{VERSION}' agent-orchestrator)"
          echo "RPM_VERSION=$installed"
          case "$installed" in
            0.13.0-privacy.3|0.13.0.privacy.3) ;;
            *) echo "unexpected RPM version: $installed" >&2; exit 1 ;;
          esac

      - name: Start Xvfb
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x1024x24 > /tmp/xvfb.log 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          for _ in $(seq 1 20); do
            [ -S /tmp/.X11-unix/X99 ] && exit 0
            sleep 1
          done
          cat /tmp/xvfb.log
          exit 1

      - name: Smoke rpm
        run: |
          set -euo pipefail
          APP="$(command -v agent-orchestrator)"
          CLI="$(find /usr/lib /usr/lib64 -path '*/resources/daemon/ao' -type f -print -quit)"
          test -x "$APP"
          test -x "$CLI"
          bash test/linux-candidate-smoke.sh rpm "$APP" "$CLI" "$CANDIDATE_VERSION"
