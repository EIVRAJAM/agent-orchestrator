name: Privacy guard

# Blocks a PR that reintroduces AO's outbound telemetry/diagnostics export, points
# the updater at an upstream or unauthorized repository, or adds an unreviewed
# observability dependency. Combines behavioral tests with failing static gates;
# see docs/privacy-fork.md. This fork's policy is that AO's own analytics and
# error reporting never leave the machine.
#
# The guard script refuses to run in CI when a PRIVACY_GUARD_SKIP_* (or
# *_STATIC_ONLY) variable is set, so this job always runs every mandatory part.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      # Products and their telemetry surfaces. The whole packages tree is
      # covered: product-ui is bundled into the renderer, cloud-client and
      # mobile are integrated apps, and a dependency or import can appear in any
      # of them.
      - "backend/**"
      - "frontend/**"
      - "packages/**"
      - "contracts/**"
      # Files that can change the policy, the release target, or packaging.
      - "desktop-version-floor.json"
      - "package.json"
      - "package-lock.json"
      - "go.work"
      - "go.work.sum"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: privacy-guard-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            packages/mobile/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Install mobile dependencies
        working-directory: packages/mobile
        run: npm ci --no-audit --no-fund

      - name: Privacy guard self-tests
        run: bash scripts/privacy-guard.test.sh

      - name: Privacy guard
        run: bash scripts/privacy-guard.sh
